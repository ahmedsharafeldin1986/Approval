<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج موافقة - مديرية الشؤون الصحية بالإسكندرية</title>
    <!-- مكتبة QR Code سريعة وموثوقة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-title h2 {
            margin: 0;
            color: #2e7d32;
            font-size: 20px;
        }
        .header-title h4 {
            margin: 5px 0 0 0;
            color: #555;
            font-size: 14px;
        }
        .qr-box {
            width: 110px;
            height: 110px;
            border: 1px solid #ccc;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 5px;
        }
        .qr-box img, .qr-box canvas {
            max-width: 100%;
            max-height: 100%;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full {
            grid-column: span 2;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #2e7d32;
        }
        input, select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .read-only-box {
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            font-weight: bold;
        }
        .btn-print {
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn-print:hover {
            background: #1b5e20;
        }
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .btn-print { display: none; }
            input { border: none; border-bottom: 1px dashed #666; border-radius: 0; background: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h2>مديرية الشؤون الصحية بالإسكندرية</h2>
            <h4>وحدة التخلص الآمن - نموذج موافقة بيئية موحد</h4>
        </div>
        <!-- مربع الـ QR Code المتغير -->
        <div class="qr-box" id="qrcode"></div>
    </div>

    <form id="approvalForm">
        <div class="form-grid">
            <div class="form-group">
                <label>اسم المنشأة الطبية:</label>
                <input type="text" id="facilityName" placeholder="أدخل اسم المنشأة" oninput="generateQR()">
            </div>
            <div class="form-group">
                <label>التخصص / النشاط:</label>
                <input type="text" id="activityType" placeholder="مثال: عيادة خاصة / مركز طبي" oninput="generateQR()">
            </div>
            <div class="form-group">
                <label>اسم المدير الفني / المسؤول:</label>
                <input type="text" id="managerName" placeholder="أدخل الاسم الثلاثي/الرباعي" oninput="generateQR()">
            </div>
            <div class="form-group">
                <label>الرقم القومي للمسؤول:</label>
                <input type="text" id="nationalId" maxlength="14" placeholder="14 رقم" oninput="generateQR()">
            </div>
            <div class="form-group full">
                <label>العنوان التفصيلي للمنشأة:</label>
                <input type="text" id="address" placeholder="المحافظة - المركز/المدينة - الشارع - رقم العقار" oninput="generateQR()">
            </div>
            <div class="form-group">
                <label>تاريخ المعاينة والمعالجة:</label>
                <input type="text" id="date" class="read-only-box" value="17 أكتوبر 2026" readonly>
            </div>
            <div class="form-group">
                <label>رقم كود التتبع البيئي:</label>
                <input type="text" id="trackingCode" class="read-only-box" value="ENV-885978" readonly>
            </div>
        </div>

        <button type="button" class="btn-print" onclick="window.print()">🖨️ طباعة الموافقة</button>
    </form>
</div>

<script>
    let qr;

    function generateQR() {
        const facility = document.getElementById('facilityName').value || 'منشأة بيئية';
        const manager = document.getElementById('managerName').value || 'غير محدد';
        const code = document.getElementById('trackingCode').value;
        const date = document.getElementById('date').value;

        // نص البيانات المصفر داخل الـ QR لضمان التوثيق
        const qrText = `مديرية الشؤون الصحية بالإسكندرية\nكود التتبع: ${code}\nالمنشأة: ${facility}\nالمسؤول: ${manager}\nتاريخ التوثيق: ${date}\nالحالة: موافقة معتمدة رسمياً`;

        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // تفريغ المربع قبل إعادة الرسم

        qr = new QRCode(qrContainer, {
            text: qrText,
            width: 100,
            height: 100,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    // تشغيل الدالة فور تحميل الصفحة
    window.onload = function() {
        generateQR();
    };
</script>

</body>
</html>

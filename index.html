<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج موافقة - مديرية الشؤون الصحية بالإسكندرية</title>
    <!-- مكتبة QR خفيفة وسريعة جداً مع تضمين تلقائي -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-title h2 {
            margin: 0;
            color: #2e7d32;
            font-size: 18px;
        }
        .header-title h4 {
            margin: 5px 0 0 0;
            color: #555;
            font-size: 13px;
        }
        .qr-box {
            width: 110px;
            height: 110px;
            border: 2px solid #2e7d32;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 6px;
        }
        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full {
            grid-column: span 2;
        }
        label {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 12px;
            color: #2e7d32;
        }
        input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            width: 100%;
        }
        .read-only-box {
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            font-weight: bold;
        }
        .btn-print {
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .btn-print { display: none; }
            input { border: none; border-bottom: 1px dashed #666; border-radius: 0; background: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h2>مديرية الشؤون الصحية بالإسكندرية</h2>
            <h4>وحدة التخلص الآمن - نموذج موافقة بيئية موحد</h4>
        </div>
        <div class="qr-box" id="qrContainer"></div>
    </div>

    <form id="approvalForm">
        <div class="form-grid">
            <div class="form-group">
                <label>اسم المنشأة الطبية:</label>
                <input type="text" id="facilityName" placeholder="أدخل اسم المنشأة" oninput="renderQR()">
            </div>
            <div class="form-group">
                <label>التخصص / النشاط:</label>
                <input type="text" id="activityType" placeholder="مثال: عيادة خاصة / مركز طبي" oninput="renderQR()">
            </div>
            <div class="form-group">
                <label>اسم المدير الفني / المسؤول:</label>
                <input type="text" id="managerName" placeholder="أدخل الاسم الثلاثي/الرباعي" oninput="renderQR()">
            </div>
            <div class="form-group">
                <label>الرقم القومي للمسؤول:</label>
                <input type="text" id="nationalId" maxlength="14" placeholder="14 رقم" oninput="renderQR()">
            </div>
            <div class="form-group full">
                <label>العنوان التفصيلي للمنشأة:</label>
                <input type="text" id="address" placeholder="المحافظة - المركز/المدينة - الشارع - رقم العقار" oninput="renderQR()">
            </div>
            <div class="form-group">
                <label>تاريخ المعاينة والمعالجة:</label>
                <input type="text" id="date" class="read-only-box" value="17 أكتوبر 2026" readonly>
            </div>
            <div class="form-group">
                <label>رقم كود التتبع البيئي:</label>
                <input type="text" id="trackingCode" class="read-only-box" value="ENV-885978" readonly>
            </div>
        </div>

        <button type="button" class="btn-print" onclick="window.print()">🖨️ طباعة الموافقة</button>
    </form>
</div>

<script>
    function drawFallbackQR(text) {
        // توليد QR عبر خدمة تحويل مباشرة وموثوقة كصورة
        const encodedText = encodeURIComponent(text);
        const imgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedText}`;
        document.getElementById('qrContainer').innerHTML = `<img src="${imgUrl}" alt="QR Code">`;
    }

    function renderQR() {
        const facility = document.getElementById('facilityName').value || 'منشأة بيئية';
        const manager = document.getElementById('managerName').value || 'غير محدد';
        const code = document.getElementById('trackingCode').value;
        const date = document.getElementById('date').value;

        const qrText = `مديرية الشؤون الصحية بالإسكندرية\nكود التتبع: ${code}\nالمنشأة: ${facility}\nالمسؤول: ${manager}\nتاريخ التوثيق: ${date}\nالحالة: موافقة معتمدة رسمياً`;

        try {
            if (typeof qrcode !== 'undefined') {
                const qr = qrcode(0, 'M');
                qr.addData(qrText);
                qr.make();
                document.getElementById('qrContainer').innerHTML = qr.createImgTag(4);
            } else {
                drawFallbackQR(qrText);
            }
        } catch (e) {
            drawFallbackQR(qrText);
        }
    }

    window.onload = renderQR;
</script>

</body>
</html>
